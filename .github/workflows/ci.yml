name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  crypto-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      # rfc test vectors: md4, rc4, nfold, string2key aes128/256
      - name: Verify crypto against RFC vectors
        run: ruby ci/crypto_vectors.rb

  live-kdc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install a real MIT KDC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq krb5-kdc krb5-admin-server
      - name: Stand up TEST.LOCAL realm
        run: sudo bash ci/kdc_setup.sh
      - name: Run attacks against the live KDC
        run: bash ci/live_attack.sh
